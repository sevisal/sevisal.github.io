# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Primary weekly sync + delayed-run fallback
  schedule:
    - cron: "58 11 * * 2"
      timezone: "Europe/Madrid"
    - cron: "41 6 * * 3"
      timezone: "Europe/Madrid"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.115.4
      MAIL_CONNECTION: ${{ secrets.MAIL_CONNECTION }}

    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
            && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: npm install -g sass

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Decide whether academic sync is needed
        id: sync-gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Pushes, manual runs, and the Monday schedule run the sync normally.
          echo "run_sync=true" >> "$GITHUB_OUTPUT"
          echo "reason=Primary/manual/push run" >> "$GITHUB_OUTPUT"

          # The Tuesday cron is only a fallback.
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "41 8 * * 2" ]]; then
            SINCE_UTC="$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ)"

            echo "Tuesday fallback check."
            echo "Looking for a successful scheduled run of this workflow since ${SINCE_UTC}."
            echo "This also catches a Monday job that GitHub delayed until Tuesday."

            SUCCESSFUL_PRIMARY_RUNS="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/hugo.yaml/runs?event=schedule&status=success&per_page=30" \
                --jq "[.workflow_runs[] | select(.created_at >= \"${SINCE_UTC}\")] | length"
            )"

            echo "Successful scheduled runs found since Monday: ${SUCCESSFUL_PRIMARY_RUNS}"

            if [[ "${SUCCESSFUL_PRIMARY_RUNS}" -gt 0 ]]; then
              echo "run_sync=false" >> "$GITHUB_OUTPUT"
              echo "reason=Tuesday fallback skipped: Monday scheduled run succeeded" >> "$GITHUB_OUTPUT"
            else
              echo "run_sync=true" >> "$GITHUB_OUTPUT"
              echo "reason=Tuesday fallback executed: no successful Monday scheduled run found" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python
        if: steps.sync-gate.outputs.run_sync == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync publications from ORCID, arXiv, and Crossref
        if: steps.sync-gate.outputs.run_sync == 'true'
        run: python scripts/sync_orcid_publications.py

      - name: Sync projects from UC3M
        if: steps.sync-gate.outputs.run_sync == 'true'
        run: python scripts/sync_uc3m_projects.py

      - name: Commit updated academic profile
        if: steps.sync-gate.outputs.run_sync == 'true'
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Sync academic profile from ORCID, arXiv, Crossref, and UC3M"
          file_pattern: "content/publications/* content/projects/_index.md"

      - name: Warn if status email is not configured
        if: env.MAIL_CONNECTION == ''
        run: |
          echo "::warning::MAIL_CONNECTION is not configured. The temporary status email cannot be sent."

      # TEMPORARY: send a status email on every workflow run while testing SMTP.
      # Once email delivery is confirmed, replace the condition with the desired
      # permanent policy (for example, only when academic content changes).
      - name: Email workflow status notification
        if: env.MAIL_CONNECTION != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "sevisal.github.io workflow status — ${{ github.event_name }}"
          to: "casevill@ing.uc3m.es"
          from: "GitHub Actions <${{ secrets.MAIL_USERNAME }}>"
          body: |
            The sevisal.github.io workflow ran.

            Trigger: ${{ github.event_name }}
            Scheduled expression: ${{ github.event.schedule }}
            Academic sync requested: ${{ steps.sync-gate.outputs.run_sync }}
            Sync decision: ${{ steps.sync-gate.outputs.reason }}
            Academic content changed: ${{ steps.auto-commit.outputs.changes_detected }}
            Commit created: ${{ steps.auto-commit.outputs.commit_hash }}

            Workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Website:
            https://sevisal.github.io/

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --buildFuture \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
